<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<!-- 由 scripts/slides/render_deck.py 產生；內容只來自 CMP-wiki。配色依 DESIGN.md。 -->
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --line: #e6e4df; --muted: #8f8a82;
  --text: #3f3d39; --dark: #1f1e1c; --blue: #2f5d8a; --orange: #c0793a;
  --blue-soft: rgba(47, 93, 138, 0.08); --blue-mid: rgba(47, 93, 138, 0.16); --orange-soft: rgba(192, 121, 58, 0.12);
  --stage: #2b2f36;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--stage); }
body { font-family: "Noto Sans TC", system-ui, sans-serif; color: var(--text); overflow: hidden; }
#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#deck { width: 1280px; height: 720px; position: relative; transform-origin: center center; }
.slide {
  position: absolute; inset: 0; background: var(--bg); padding: 44px 72px 0;
  display: none; flex-direction: column; border-radius: 6px; overflow: hidden;
}
.slide.active, .slide.measure { display: flex; }
.slide header { flex: 0 0 auto; }
.kicker { font: 500 15px/1 "JetBrains Mono", monospace; color: var(--orange); letter-spacing: .08em; }
.slide h1 { margin: 10px 0 0; font-size: 40px; line-height: 1.2; color: var(--dark); font-weight: 700; }
.key {
  margin-top: 18px; padding: 12px 20px; border-left: 5px solid var(--blue);
  background: var(--blue-soft); font-size: 24px; line-height: 1.5; color: var(--dark); border-radius: 0 6px 6px 0;
}
.body { flex: 1 1 auto; min-height: 0; overflow: hidden; padding: 18px 0 8px; font-size: 22px; line-height: 1.55;
  display: flex; flex-direction: column; gap: 14px; }
.layout-split .body { display: grid; grid-template-columns: 1.1fr 1fr; align-items: start; align-content: start; column-gap: 36px; row-gap: 18px; }
.body ul, .body ol { margin: 0; padding-left: 1.3em; }
.body li { margin: 6px 0; }
.body li::marker { color: var(--blue); }
.body p { margin: 0; }
.math-block { padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 24px; overflow: hidden; }
.math-block .katex-display { margin: 0; }
code { font-family: "JetBrains Mono", monospace; font-size: .88em; background: var(--line); padding: 0 .3em; border-radius: 3px; }
strong { color: var(--dark); }
.cite {
  display: inline-block; margin-left: 3px; min-width: 16px; padding: 0 4px; font: 600 12px/16px "JetBrains Mono", monospace;
  vertical-align: super; text-align: center; color: var(--blue); background: var(--blue-soft); border-radius: 8px; text-decoration: none;
}
.cite:hover { background: var(--orange-soft); color: var(--orange); }
.figcite { text-align: right; margin-top: -8px; line-height: 1; }
/* flow / cycle */
.flow { display: flex; align-items: stretch; gap: 10px; }
.flow .box {
  flex: 1 1 0; min-width: 0; padding: 14px 12px; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--panel);
  border: 2px solid var(--blue); border-radius: 10px; font-size: 20px; line-height: 1.35; color: var(--dark);
}
.flow .box.hi, .flow .box:last-child { border-color: var(--orange); background: var(--orange-soft); }
.flow .arrow { flex: 0 0 auto; align-self: center; color: var(--orange); font-size: 26px; font-weight: 700; }
.cycle-back { position: relative; height: 34px; margin: 0 6% 0 6%; border: 2px dashed var(--orange); border-top: none; border-radius: 0 0 12px 12px; }
.cycle-back > .cb-label { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); background: var(--bg); padding: 0 10px; font-size: 17px; color: var(--orange); white-space: nowrap; }
.cycle-back::before { content: "▲"; position: absolute; left: -9px; top: -12px; color: var(--orange); font-size: 14px; }
/* vertical stack */
.stack { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.stack .box { width: 72%; padding: 9px 14px; text-align: center; background: var(--panel); border: 2px solid var(--blue); border-radius: 10px; font-size: 20px; color: var(--dark); }
.stack .box.hi { border-color: var(--orange); background: var(--orange-soft); }
.stack .down { color: var(--orange); font-size: 18px; line-height: 1; }
/* card grid */
.grid { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--blue); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.card:nth-child(even) { border-top-color: var(--orange); }
.card .ct { font-weight: 700; color: var(--dark); font-size: 20px; line-height: 1.35; }
.card .cd { font-size: 18px; line-height: 1.45; margin-top: 6px; }
/* energy ladder */
.ladder { display: grid; grid-template-columns: 40px 1fr; align-items: center; row-gap: 0; position: relative; }
.ladder .axis { grid-column: 1; grid-row: 1 / span 99; align-self: stretch; position: relative; }
.ladder .axis::before { content: ""; position: absolute; left: 18px; top: 6px; bottom: 0; border-left: 2px solid var(--muted); }
.ladder .axis::after { content: "E ↑"; position: absolute; left: 4px; top: -22px; font: 700 18px "JetBrains Mono", monospace; color: var(--muted); }
.ladder .lvl { grid-column: 2; border-bottom: 4px solid var(--blue); padding: 4px 6px; font-size: 19px; color: var(--dark); }
.ladder .lvl:last-of-type { border-bottom-color: var(--orange); }
.ladder .gap { grid-column: 2; display: flex; align-items: center; gap: 10px; height: 52px; padding-left: 30px; font-size: 18px; color: var(--orange); font-weight: 500; }
.ladder .gap::before { content: "↕"; font-size: 26px; }
/* minimum curve */
.curve { position: relative; height: 230px; margin-bottom: 34px; }
.curve svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.curve .lab { position: absolute; font-size: 22px; color: var(--dark); }
/* numbered chain */
.chain { display: flex; flex-direction: column; gap: 7px; }
.step { display: grid; grid-template-columns: 34px 132px 1fr; align-items: center; gap: 12px; font-size: 19px; line-height: 1.4; }
.step .no { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff; font: 700 15px/30px "JetBrains Mono", monospace; text-align: center; }
.step .tag { font: 500 14px/1 "JetBrains Mono", monospace; text-align: center; padding: 5px 0; border-radius: 12px; background: var(--blue-soft); color: var(--blue); }
.step.approx .no { background: var(--orange); }
.step.approx .tag { background: var(--orange-soft); color: var(--orange); }
/* tables */
table.compare { width: 100%; border-collapse: collapse; font-size: 19px; line-height: 1.4; background: var(--panel); }
table.compare th { background: var(--blue); color: #fff; text-align: left; padding: 7px 12px; font-weight: 500; }
table.compare td { border-bottom: 1px solid var(--line); padding: 7px 12px; vertical-align: top; }
table.compare tr td:first-child { color: var(--dark); font-weight: 500; }
/* footer */
.slide footer {
  flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 0; padding: 10px 0 16px;
  border-top: 1px solid var(--line); font-size: 13px; color: var(--muted);
}
.src-label { margin-right: 10px; }
.src { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; color: var(--blue); text-decoration: none; }
.src:hover { color: var(--orange); }
.src-n { min-width: 16px; padding: 0 4px; font: 600 11px/16px "JetBrains Mono", monospace; text-align: center; background: var(--blue-soft); border-radius: 8px; }
.credit { margin-left: auto; }
.credit a { color: var(--muted); }
/* title */
.layout-title { justify-content: center; background: linear-gradient(135deg, #fbfaf7 0%, #eef2f7 100%); }
.layout-title header { margin-top: auto; }
.layout-title h1 { font-size: 54px; max-width: 980px; }
.layout-title .key { font-size: 26px; max-width: 980px; border-left-color: var(--orange); background: var(--orange-soft); }
.layout-title .body { flex: 0 0 auto; font-size: 20px; color: var(--muted); }
.layout-title .math-block { font-size: 28px; }
.layout-title footer { margin-top: auto; }
/* chrome */
#progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--orange); transition: width .2s; }
#hint { position: fixed; right: 12px; top: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(0,0,0,.45); color: #e9edf1; font-size: 12px; font-family: system-ui, sans-serif; transition: opacity .6s; pointer-events: none; }
#hint.gone { opacity: 0; }
#check-result { display: none; }
@media print {
  html, body { overflow: visible; background: #fff; }
  #viewport { position: static; display: block; }
  #deck { transform: none !important; width: auto; height: auto; }
  .slide { display: flex !important; position: relative; width: 1280px; height: 720px; page-break-after: always; }
  #progress, #hint { display: none; }
}
</style>
</head>
<body>
<div id="viewport"><div id="deck">
{{SLIDES}}
</div></div>
<div id="progress"></div>
<div id="hint">← → 換頁 · F 全螢幕</div>
<pre id="check-result"></pre>
<script>
(function () {
  const N = {{COUNT}};
  const slides = Array.from(document.querySelectorAll(".slide"));
  const params = new URLSearchParams(location.search);
  let cur = 0;

  function fit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    document.getElementById("deck").style.transform = "scale(" + s + ")";
  }
  function show(i) {
    cur = Math.max(0, Math.min(N - 1, i));
    slides.forEach((el, k) => el.classList.toggle("active", k === cur));
    document.getElementById("progress").style.width = ((cur + 1) / N * 100) + "%";
    if (!params.has("slide")) history.replaceState(null, "", "#" + (cur + 1));
  }
  window.addEventListener("resize", fit);
  document.addEventListener("keydown", (e) => {
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)) { e.preventDefault(); show(cur + 1); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(cur - 1); }
    else if (e.key === "Home") show(0);
    else if (e.key === "End") show(N - 1);
    else if (e.key === "f" || e.key === "F") {
      if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
    }
  });
  document.getElementById("viewport").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    show(e.clientX > window.innerWidth / 2 ? cur + 1 : cur - 1);
  });

  // 版面修正（不改字）：太寬的數學式逐步縮小字級，最小 14px。必須在字型載入完成後量測，
  // 否則量到的是後備字型的寬度（2026-11-23 第 3 頁上線後被截掉的原因）。
  function shrinkMath() {
    slides.forEach((el) => {
      el.classList.add("measure");
      el.querySelectorAll(".math-block").forEach((m) => {
        let size = parseFloat(getComputedStyle(m).fontSize);
        const wide = () => [m, ...m.querySelectorAll(".katex-display")].some((x) => x.scrollWidth > x.clientWidth + 1);
        while (wide() && size > 14) { size -= 1; m.style.fontSize = size + "px"; }
      });
      el.classList.remove("measure");
    });
  }

  // 關卡 9 用：?check=1 時逐頁量測，結果寫進 #check-result
  function contentRight(host) {
    // 以方框的可見邊界為準（含 padding），超出才算溢出
    const r = host.getBoundingClientRect();
    return [r.left - 1, r.right + 1];
  }
  // 先讓每一頁都排版一次，觸發所有字型下載，再等到字型全部載入
  async function loadAllFonts() {
    slides.forEach((el) => el.classList.add("measure"));
    void document.body.offsetHeight;
    for (let k = 0; k < 20 && document.fonts.status !== "loaded"; k++) {
      try { await document.fonts.ready; } catch (e) {}
      await new Promise((r) => setTimeout(r, 50));
    }
    slides.forEach((el) => el.classList.remove("measure"));
  }
  function runCheck() {
    const report = [];
    slides.forEach((el, k) => {
      show(k);
      const issues = [];
      const body = el.querySelector(".body");
      if (body.scrollHeight > body.clientHeight + 1) issues.push("vertical overflow " + (body.scrollHeight - body.clientHeight) + "px");
      const box = el.getBoundingClientRect();
      el.querySelectorAll(".body *:not(.katex-mathml):not(.katex-mathml *)").forEach((c) => {
        const r = c.getBoundingClientRect();
        if (r.width && r.right > box.right + 1) issues.push("outside slide: " + (c.className || c.tagName));
      });
      el.querySelectorAll(".math-block, .katex-display").forEach((m) => {
        if (m.scrollWidth > m.clientWidth + 1) issues.push("wide math " + (m.scrollWidth - m.clientWidth) + "px");
      });
      el.querySelectorAll(".katex").forEach((m) => {
        if (m.closest(".katex-mathml") || m.closest(".katex-display")) return;
        // 每個數學式都要在包住它的方框裡；找不到指定方框時用最近的區塊元素（2026-11-23 cycle 標籤的式子跑位沒被抓到）
        const host = m.parentElement.closest("li, .box, .card, td, th, .key, p, .step, .lvl, .gap, .lab, .cb-label, div");
        if (!host) return;
        // 量測式子裡每一個可見的部件（.base），不只外框：部件被 CSS 拉走時外框量不到（迴歸測試）
        const hr = host.getBoundingClientRect();
        const parts = [m, ...m.querySelectorAll(".katex-html .base")];
        const out = parts.some((q) => {
          const r = q.getBoundingClientRect();
          return r.width && (r.right > hr.right + 2 || r.left < hr.left - 2 || r.top < hr.top - 12 || r.bottom > hr.bottom + 12);
        });
        if (out) issues.push("inline math outside its box: " + (host.className || host.tagName));
      });
      el.querySelectorAll(".box, .card, .lvl, td").forEach((b) => {
        if (b.scrollWidth > b.clientWidth + 1) issues.push("text wider than box: " + (b.className || b.tagName));
      });
      const kerr = el.querySelectorAll(".katex-error").length;
      if (kerr) issues.push(kerr + " KaTeX error(s)");
      const unrendered = (el.textContent.match(/\$/g) || []).length;
      if (unrendered) issues.push("unrendered $ x" + unrendered);
      report.push({ slide: k + 1, issues: Array.from(new Set(issues)) });
    });
    document.getElementById("check-result").textContent = JSON.stringify({ count: N, katex: typeof katex !== "undefined", fonts: document.fonts.status, slides: report });
  }

  async function start() {
    fit();
    // KaTeX 從 CDN 載入，連線慢時 load 事件之後才到：最多等 10 秒（2026-11-23 截圖出現未渲染的 $…$）
    for (let k = 0; k < 100 && !window.renderMathInElement; k++) await new Promise((r) => setTimeout(r, 100));
    if (window.renderMathInElement) {
      renderMathInElement(document.getElementById("deck"), {
        delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
        throwOnError: false
      });
    }
    await loadAllFonts();
    shrinkMath();
    const want = parseInt(params.get("slide") || location.hash.slice(1) || "1", 10);
    show(isNaN(want) ? 0 : want - 1);
    if (params.has("check")) runCheck();
    const hint = document.getElementById("hint");
    if (params.has("slide") || params.has("check")) hint.style.display = "none";
    else setTimeout(() => hint.classList.add("gone"), 4000);
  }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>
