# push 到 main 後：lint → Quartz 建置 → 部署到 GitHub Pages（README.md「Deploy」）
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint (raw/ 不在 CI，講義相關檢查會略過)
        run: |
          pip install pyyaml
          python3 scripts/lint.py
      - name: Public-release check
        run: |
          if git ls-files | grep -iE '\.(pdf|vtt|srt)$|^raw/'; then
            echo "原站檔案不可進 git（AGENTS.md §6）"; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build with Quartz
        run: bash .quartz/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
